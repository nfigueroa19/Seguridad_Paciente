# Fragmento de nginx para servir los videos HLS en la intranet.
# Incluir dentro del bloque server { } del contenedor que sirve app-plataforma/.
# Los videos viven en un volumen montado en /usr/share/nginx/html/media/videos
# (la misma estructura que genera procesar-videos.sh).

location /media/videos/ {
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
        image/webp                    webp;
        application/json              json;
    }

    # Las listas pueden cambiar si se reprocesa un video: revalidar siempre.
    location ~ \.(m3u8|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Segmentos y portadas: un día de caché. No se usa "immutable" porque
    # reprocesar un video (FORZAR=1) reutiliza los mismos nombres de archivo.
    location ~ \.(ts|webp)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    sendfile on;
    tcp_nopush on;
}

# El mime.types de serie de nginx no trae .wav: sin esto, "clic-boton.wav" del juego
# Neumonía Cero se entrega como application/octet-stream. Un bloque "types" dentro de un
# location reemplaza los tipos heredados, por eso se vuelve a incluir mime.types.
location /juegos/ {
    include mime.types;
    types {
        audio/wav wav;
    }
}
