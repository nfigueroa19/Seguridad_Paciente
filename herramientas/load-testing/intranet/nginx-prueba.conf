# Servidor de prueba que imita el despliegue de intranet: nginx sirviendo app-plataforma/
# con el fragmento real de herramientas/video/docker/nginx-videos.conf.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Solo para la prueba de carga: /media/videos/copiaN-<id>/... sirve los archivos de
    # /media/videos/<id>/... Así 4 videos reales se comportan como 4×N videos con rutas
    # (y URLs de caché) distintas, sin duplicar archivos en disco.
    rewrite ^/media/videos/copia\d+-([^/]+)/(.*)$ /media/videos/$1/$2 last;

    include /etc/nginx/snippets/nginx-videos.conf;
}
